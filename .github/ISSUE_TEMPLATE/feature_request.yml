name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Your idea for the feature. Sketches or screenshots welcome.
  - type: input
    id: model
    attributes:
      label: Receiver model
      description: If the feature depends on what your receiver supports.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No"
